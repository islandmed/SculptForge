id: org.sculptforge.SculptForge
name: SculptForge
summary: Digital sculpting for artists and game pipelines
website: https://sculptforge.app/
source_url: https://github.com/islandmed/SculptForge
build:
  manifest: org.sculptforge.SculptForge.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: Graphics
  tags:
    - 3DGraphics
    - Sculpting
    - Modeling
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
