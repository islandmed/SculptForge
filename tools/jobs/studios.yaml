# Studios and companies whose OFFICIAL public job feeds feed sculptforge.app/jobs.html (tools/jobs/fetch.py, daily).
# Only feeds a company publishes for embedding: Greenhouse job board API, Lever postings API, Ashby posting API,
# Recruitee careers API, Personio XML feed, Teamtailor RSS. Never LinkedIn, Indeed, ArtStation, Glassdoor or any site
# whose terms forbid it. SmartRecruiters is out: its robots.txt disallows every crawler but one.
# One line per source: {name, ats, slug, sector}. ats: greenhouse | lever | lever-eu | ashby | recruitee | personio |
# teamtailor. sector: games | film-vfx | animation | collectibles | 3d-printing | jewelry | medical-dental |
# product-viz | ar-vr | advertising | archviz | outsourcing. A role's region comes from its own location (a studio's
# office abroad counts there); the group below is the studio's home, used when the location names no country.
# Adding one: check the feed answers and lists this company's jobs (not a namesake), then add the line here.

