<!doctype html>
<!-- SculptForge Forge Deck (docs/phone-link.md): the phone as a control pad for a sculpting session on a computer.
     This page is served over HTTPS from the website; it talks to SculptForge on your computer over a WebRTC data channel
     (set up through this URL's #fragment, which browsers never send to the website) and, when a phone cannot reach the
     computer on the home network, through the link relay with AES-256-GCM envelopes only SculptForge can read or forge.
     Every tap is ONE command from a short list (brush, undo, redo, size, intensity, mirror); the computer refuses
     anything else. The page has no canvas on purpose. GPL-3.0-or-later. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0f12">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src https: http:; base-uri 'none'; form-action 'none'">
<title>SculptForge Deck</title>
<style>
:root { --bg:#0f0f12; --bg2:#15151a; --panel:#1b1b21; --panel2:#24242c; --border:#2a2a31; --text:#ececf1; --muted:#a3a3ad;
        --accent:#f28c3c; --accent2:#ffb06a; --ok:#4ad295; --bad:#ff6b6b; --warn:#ffcf5a;
        --gap:10px; --pad:14px; --r:18px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text); overscroll-behavior:none; }
body { font:400 16px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased;
       user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; overflow:hidden; }
button { font:inherit; color:inherit; }
.app { height:100vh; height:100dvh; display:grid; gap:var(--gap); padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + var(--pad))
       calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + var(--pad)); max-width:1100px; margin:0 auto;
       grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto auto minmax(0,1fr) auto;
       grid-template-areas:"head" "read" "ctl" "tiles" "bar"; }
header { grid-area:head; display:flex; align-items:center; gap:10px; min-height:44px; }
header .brand { display:flex; align-items:center; gap:8px; font-weight:650; flex:1; min-width:0; }
header .brand span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pill { display:flex; align-items:center; gap:7px; font-size:13px; padding:5px 11px 5px 9px; border-radius:999px; background:var(--panel);
        border:1px solid var(--border); color:var(--muted); white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
.pill.ok .dot { background:var(--ok); box-shadow:0 0 8px var(--ok); } .pill.wait .dot { background:var(--warn); animation:pulse 1.2s infinite; }
.pill.bad .dot { background:var(--bad); } .pill.relay { color:#c9c9d2; }
@keyframes pulse { 50% { opacity:.35; } }
.quiet { min-height:44px; min-width:44px; padding:0 14px; border-radius:12px; border:1px solid var(--border); background:var(--panel); color:var(--muted); font-size:14px; font-weight:600; }
.quiet:active { background:var(--panel2); }

.readout { grid-area:read; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:12px 16px; min-height:104px;
           display:flex; flex-direction:column; justify-content:center; }
.readout .where { font-size:13px; color:var(--muted); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.readout .tool { font-size:clamp(34px, 11vw, 56px); font-weight:720; letter-spacing:-.025em; line-height:1.05; color:var(--accent2);
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.readout .sub { color:var(--muted); font-size:15px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.ctl { grid-area:ctl; display:grid; gap:var(--gap); align-content:start; }
.ctlrow { background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:8px 10px 6px; }
.ctlhead { display:flex; align-items:baseline; justify-content:space-between; padding:0 4px; min-height:30px; }
.ctlhead .name { font-weight:650; font-size:15px; color:var(--muted); }
.ctlhead .hint { flex:1; text-align:center; font-size:12px; color:var(--accent2); opacity:0; transition:opacity .12s; }
.ctlhead .hint.on { opacity:1; }
.val { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; background:none; border:0; padding:2px 6px; border-radius:10px; min-width:84px; text-align:right; }
.val:active { background:var(--panel2); }
.track { position:relative; height:56px; border-radius:14px; background:var(--bg2); border:1px solid var(--border); overflow:hidden; touch-action:none; cursor:pointer; outline:none; }
.track:focus-visible { box-shadow:0 0 0 2px var(--accent); }
.track .fill { position:absolute; inset:0 auto 0 0; width:50%; background:linear-gradient(90deg, rgba(242,140,60,.18), rgba(242,140,60,.6)); }
.track .grip { position:absolute; top:6px; bottom:6px; width:6px; margin-left:-3px; border-radius:3px; background:var(--accent2); box-shadow:0 0 10px rgba(255,176,106,.6); }
.track .tick { position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.12); }

.tiles { grid-area:tiles; overflow-y:auto; overflow-x:hidden; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:var(--gap); align-content:start;
         padding:2px 2px 6px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; }
.tile { position:relative; display:block; width:100%; border-radius:var(--r); border:2px solid var(--border); background:var(--panel); padding:0; overflow:hidden; cursor:pointer; touch-action:manipulation; }
.tile::before { content:""; display:block; padding-top:100%; }
.tile img, .tile .art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.tile span { position:absolute; left:0; right:0; bottom:0; padding:6px 4px; background:rgba(15,15,18,.8); font-size:15px; font-weight:650; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile.noimg span { top:0; display:grid; place-items:center; background:none; font-size:17px; }
.tile.on { border-color:var(--accent); box-shadow:0 0 0 3px rgba(242,140,60,.3); }
.tile:active { transform:scale(.97); }

.bar { grid-area:bar; display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--gap); }
.bar button { min-height:64px; border-radius:var(--r); border:1px solid var(--border); background:var(--panel); font-size:18px; font-weight:650; }
.bar button:active { background:var(--panel2); transform:scale(.97); }
.bar button.on { background:rgba(242,140,60,.22); border-color:var(--accent); color:var(--accent2); }

.scrim { position:fixed; inset:0; display:none; place-items:center; padding:24px; background:rgba(15,15,18,.9); z-index:5; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.scrim.on { display:grid; } .scrim.soft { background:rgba(15,15,18,.72); }
.card { width:min(420px, 100%); text-align:center; }
.card .spin { width:34px; height:34px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); margin:0 auto 16px; animation:spin 1s linear infinite; }
.card .spin.static { animation:none; border-top-color:var(--border); } .card .spin.bad { animation:none; border-color:var(--bad); }
@keyframes spin { to { transform:rotate(360deg); } }
.card h1 { font-size:26px; line-height:1.15; margin:0 0 8px; letter-spacing:-.02em; }
.card p { margin:0 0 12px; color:var(--muted); font-size:16px; }
.card button { display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; border-radius:14px; font-weight:650; font-size:17px; margin-top:10px; cursor:pointer; }
.card .primary { border:0; color:#1a0d04; background:linear-gradient(180deg,#f6994d,#e2742a); }
.card .secondary { border:1px solid var(--border); background:var(--panel2); }

.sheet { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--panel); border-top:1px solid var(--border); border-radius:22px 22px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
         transform:translateY(105%); transition:transform .18s ease-out; max-width:600px; margin:0 auto; }
.sheet.on { transform:none; }
.sheet h2 { margin:0 0 10px; font-size:18px; }
.sheet .field { display:flex; gap:10px; align-items:center; }
.sheet input { flex:1; min-width:0; height:56px; border-radius:14px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:26px; padding:0 14px; font-variant-numeric:tabular-nums; user-select:text; -webkit-user-select:text; }
.sheet .step { width:56px; height:56px; border-radius:14px; border:1px solid var(--border); background:var(--panel2); font-size:26px; }
.sheet .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.sheet .row button { min-height:52px; border-radius:14px; border:1px solid var(--border); background:var(--panel2); font-weight:650; font-size:17px; }
.sheet .row .go { border:0; color:#1a0d04; background:linear-gradient(180deg,#f6994d,#e2742a); }
.hidden { display:none !important; }

/* Landscape phones and tablets: controls left, brushes right. */
@media (orientation:landscape) and (min-width:640px) {
  .app { grid-template-columns:minmax(300px, 44%) minmax(0,1fr); grid-template-rows:auto auto 1fr auto; column-gap:14px;
         grid-template-areas:"head head" "read tiles" "ctl tiles" "bar tiles"; }
  .readout { min-height:0; padding:8px 14px; } .readout .tool { font-size:clamp(28px, 6vh, 44px); }
  .track { height:48px; } .bar button { min-height:54px; }
  .tiles { grid-template-columns:repeat(4, minmax(0,1fr)); }
}
@media (orientation:landscape) and (max-height:430px) { .ctlrow { padding:4px 8px; } .ctlhead { min-height:24px; } .val { font-size:20px; } .track { height:40px; } .ctl { align-content:start; gap:8px; }
  .readout { min-height:0; padding:4px 14px; flex-direction:row; align-items:baseline; gap:12px; border-radius:14px; } .readout .where { display:none; }
  .readout .tool { font-size:26px; flex:none; max-width:55%; } .readout .sub { margin:0; font-size:13px; }
  .app { grid-template-rows:auto auto 1fr auto; gap:8px; } .bar button { min-height:48px; } }
@media (min-width:760px) and (orientation:portrait) { :root { --gap:14px; --pad:24px; } .tiles { grid-template-columns:repeat(4, minmax(0,1fr)); } .track { height:64px; } .readout .tool { font-size:64px; } }
@media (min-width:1000px) and (orientation:landscape) { .tiles { grid-template-columns:repeat(5, minmax(0,1fr)); } }
@media (max-width:420px) { header .brand span { display:none; } header .brand { flex:0 0 auto; } header .pill { flex:1; justify-content:center; } }
@media (prefers-reduced-motion:reduce) { .sheet { transition:none; } .card .spin, .pill.wait .dot { animation:none; } }
.help { min-height:44px; min-width:44px; padding:0; border-radius:50%; border:1px solid var(--border); background:var(--panel); color:var(--muted); font-size:18px; font-weight:700; }
.help:active { background:var(--panel2); }
.tour { position:fixed; inset:0; z-index:7; display:none; }
.tour.on { display:block; }
.tour .spot { position:fixed; border-radius:22px; box-shadow:0 0 0 9999px rgba(10,10,13,.78), 0 0 0 2px var(--accent); transition:left .2s ease-out, top .2s ease-out, width .2s ease-out, height .2s ease-out; pointer-events:none; }
.tour .tcard { position:fixed; width:min(400px, calc(100vw - 24px)); background:var(--panel); border:1px solid var(--border); border-radius:22px; padding:16px 16px 14px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
.tour .count { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.tour .count i { width:7px; height:7px; border-radius:50%; background:var(--border); } .tour .count i.on { background:var(--accent); }
.tour h2 { margin:6px 0 6px; font-size:22px; letter-spacing:-.015em; }
.tour p { margin:0 0 12px; color:var(--muted); font-size:16px; line-height:1.4; }
.tour .row { display:grid; grid-template-columns:1fr 1.6fr; gap:10px; }
.tour .row button { min-height:52px; border-radius:14px; border:1px solid var(--border); background:var(--panel2); font-weight:650; font-size:17px; cursor:pointer; }
.tour .row .go { border:0; color:#1a0d04; background:linear-gradient(180deg,#f6994d,#e2742a); }
@media (prefers-reduced-motion:reduce) { .tour .spot { transition:none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z" fill="none" stroke="#f28c3c" stroke-width="1.6" stroke-linejoin="round"/><path d="M3.8 7.4L12 12l8.2-4.6M12 12v9.2" fill="none" stroke="#ffb06a" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Forge Deck</span></div>
    <div class="pill" id="pill"><i class="dot"></i><span id="pillText">Not connected</span></div>
    <button class="quiet" id="bye" type="button">Disconnect</button>
    <button class="help" id="help" type="button" aria-label="How the Forge Deck works">?</button>
  </header>
  <section class="readout" aria-live="polite"><div class="where" id="who">&nbsp;</div><div class="tool" id="tool">&nbsp;</div><div class="sub" id="sub">&nbsp;</div></section>
  <section class="ctl">
    <div class="ctlrow"><div class="ctlhead"><span class="name">Size</span><span class="hint" id="sizeHint"></span><button class="val" id="sizeVal" type="button" aria-label="Type a size">-</button></div>
      <div class="track" id="size" role="slider" tabindex="0" aria-label="Size" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div><div class="grip"></div></div></div>
    <div class="ctlrow"><div class="ctlhead"><span class="name">Intensity</span><span class="hint" id="intHint"></span><button class="val" id="intVal" type="button" aria-label="Type an intensity">-</button></div>
      <div class="track" id="int" role="slider" tabindex="0" aria-label="Intensity" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div><div class="grip"></div></div></div>
  </section>
  <section class="tiles" id="tiles" aria-label="Brushes"></section>
  <section class="bar"><button id="undo" type="button">Undo</button><button id="redo" type="button">Redo</button><button id="mirror" type="button" aria-pressed="false">Mirror</button></section>
</div>

<div class="scrim on" id="scrim"><div class="card">
  <div class="spin" id="spin"></div><h1 id="cardTitle">Forge Deck</h1><p id="cardText"></p><p id="cardText2" class="hidden"></p>
  <button class="primary hidden" id="cardMain" type="button"></button><button class="secondary hidden" id="cardAlt" type="button"></button>
</div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">Size</h2>
  <div class="field"><button class="step" id="stepDown" type="button" aria-label="Smaller">&minus;</button>
    <input id="sheetInput" type="text" inputmode="decimal" autocomplete="off" aria-label="Value"><button class="step" id="stepUp" type="button" aria-label="Larger">+</button></div>
  <div class="row"><button id="sheetCancel" type="button">Cancel</button><button class="go" id="sheetGo" type="button">Set</button></div>
</div>

<div class="tour" id="tour" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
  <div class="spot" id="tourSpot"></div>
  <div class="tcard" id="tourCard"><div class="count" id="tourCount"></div><h2 id="tourTitle"></h2><p id="tourText"></p>
    <div class="row"><button id="tourSkip" type="button">Skip</button><button class="go" id="tourNext" type="button">Next</button></div></div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var now = function () { return performance.now(); };

  // ---- Link details: #v=1&k=token&d=desktop&o=offer&n=name&x=key&m=deck&b=relay blob url&r=answer relays... ----
  var DEMO = (location.hash.match(/[#&]demo=([a-z]+)/) || [])[1] || "";
  var STORE = "sfdeck-link";
  var fresh = false, fragText = location.hash.slice(1);
  if (!DEMO) {
    if (fragText.indexOf("o=") >= 0) {
      fresh = true;
      try { sessionStorage.setItem(STORE, JSON.stringify({ frag: fragText, at: Date.now() })); sessionStorage.removeItem("sfdeck-dseq"); } catch (e) {}
    } else {
      // A reload (the phone slept, the tab was discarded): the link is good for 5 minutes, through the relay.
      try {
        var saved = JSON.parse(sessionStorage.getItem(STORE) || "null");
        if (saved && Date.now() - saved.at < 5 * 60 * 1000) fragText = saved.frag; else { fragText = ""; sessionStorage.removeItem(STORE); }
      } catch (e) { fragText = ""; }
    }
  }
  var frag = new URLSearchParams(fragText);
  var token = frag.get("k"), desktopUrl = frag.get("d"), offer = frag.get("o"), keyText = frag.get("x"), blobUrl = frag.get("b");
  var computerName = frag.get("n") || "your computer";
  var relayBase = "", topic = "";
  if (blobUrl) { var bm = blobUrl.match(/^(https:\/\/[^/]+|http:\/\/(?:127\.0\.0\.1|localhost)(?::\d+)?)\/blob\/(sculptforge-[0-9a-f]{24})$/); if (bm) { relayBase = bm[1]; topic = bm[2]; } }
  if (!DEMO) try { history.replaceState(null, "", location.pathname); } catch (e) {}

  var b64u = {
    enc: function (bytes) { var s = ""; bytes = new Uint8Array(bytes); for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
                            return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); },
    dec: function (t) { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; var s = atob(t), b = new Uint8Array(s.length);
                        for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },
    str: function (t) { return new TextDecoder().decode(b64u.dec(t)); }
  };

  // ---- State shown ----
  var st = { tool: "", brushId: "", size: 0, sizeMinPx: 2, sizeMaxPx: 800, intensity: 0, mirrorX: false, brushes: [], desktop: "" };
  var hold = {};               // control -> time until which an incoming value must not move what the person just set
  var got = false;             // a state has arrived
  var images = {};             // tile name -> blob url
  var via = "direct";          // "direct" | "relay"
  var phase = "pairing";       // pairing | connecting | connected | reconnecting | ended | error
  var vibrates = !!navigator.vibrate;

  // ---- Feel: haptics (Android: vibrate; iPhone Safari 17.4+: a switch input's tick) ----
  var tick = null;
  function buzz(ms) {
    try {
      if (vibrates) { navigator.vibrate(ms || 8); return; }
      if (!tick) {
        tick = document.createElement("label");
        tick.style.cssText = "position:fixed;left:-99px;top:-99px;opacity:0;pointer-events:none";
        tick.innerHTML = '<input type="checkbox" switch>';
        document.body.appendChild(tick);
      }
      tick.click();
    } catch (e) {}
  }

  // ---- Size mapping: the strip's 0..1 on the desktop's log scale between the published range ----
  function sizePx(p) { return st.sizeMinPx * Math.pow(st.sizeMaxPx / st.sizeMinPx, p); }
  function sizePos(px) { px = Math.min(st.sizeMaxPx, Math.max(st.sizeMinPx, px)); return Math.log(px / st.sizeMinPx) / Math.log(st.sizeMaxPx / st.sizeMinPx); }
  var fmt = { size: function (p) { return Math.round(sizePx(p)) + " px"; }, int: function (p) { return String(Math.round(p * 100)); } };

  // ---- Sliders: drag anywhere; slide the finger away from the strip for fine control; tap the number to type it ----
  var sliders = {};
  function slider(id, cmd) {
    var el = $(id), fill = el.querySelector(".fill"), grip = el.querySelector(".grip"), valEl = $(id + "Val"), hintEl = $(id + "Hint");
    var o = { id: id, cmd: cmd, value: 0, dragging: false };
    [0.25, 0.5, 0.75].forEach(function (f) { var t = document.createElement("i"); t.className = "tick"; t.style.left = (f * 100) + "%"; el.appendChild(t); });
    o.show = function (v) {
      o.value = v;
      fill.style.width = (v * 100) + "%"; grip.style.left = (v * 100) + "%";
      valEl.textContent = fmt[id](v);
      el.setAttribute("aria-valuenow", Math.round(v * 100)); el.setAttribute("aria-valuetext", fmt[id](v));
    };
    var sentAt = 0, pending = null, band = -1, anchor = null, rate = 1;
    function flush() {
      if (pending === null) return;
      var v = pending; pending = null; sentAt = now();
      hold[id] = now() + 500;
      sendCmd({ cmd: cmd, value: Math.round(v * 1000) / 1000 });
    }
    o.set = function (v, send) {
      v = Math.min(1, Math.max(0, v));
      var nb = Math.round(v * 4);
      if (nb !== band) { if (band !== -1) buzz(10); band = nb; } // a short tick at each quarter
      o.show(v);
      if (send) { pending = v; if (now() - sentAt > (via === "relay" ? 160 : 50)) flush(); else setTimeout(flush, via === "relay" ? 160 : 50); }
    };
    function fromX(e) { var r = el.getBoundingClientRect(); return (e.clientX - r.left) / r.width; }
    function move(e) {
      var r = el.getBoundingClientRect(), cy = r.top + r.height / 2, away = Math.max(0, Math.abs(e.clientY - cy) - r.height * 0.9);
      var nr = away <= 0 ? 1 : away < 70 ? 0.5 : away < 140 ? 0.2 : 0.05;
      hintEl.textContent = nr < 1 ? "Fine control ×" + nr : ""; hintEl.classList.toggle("on", nr < 1);
      if (nr !== rate || anchor) { // relative from here on: the finger's distance from the strip sets the precision
        if (!anchor || nr !== rate) { anchor = { x: e.clientX, v: o.value }; rate = nr; }
        o.set(anchor.v + ((e.clientX - anchor.x) / r.width) * rate, true);
      } else {
        var v = fromX(e);
        [0, 0.25, 0.5, 0.75, 1].forEach(function (d) { if (Math.abs(v - d) < 0.02) v = d; }); // detents
        o.set(v, true);
      }

  function demoEcho(msg) {
    setTimeout(function () {
      if (msg.cmd === "size_set") st.size = msg.value; else if (msg.cmd === "intensity_set") st.intensity = msg.value;
      else if (msg.cmd === "brush_use") { st.brushId = msg.name; st.tool = (st.brushes.filter(function (b) { return b.id === msg.name; })[0] || {}).label || msg.name; }
      else if (msg.cmd === "symmetry_toggle") { /* shown optimistically */ }
      render(); measure({ size: st.size, intensity: st.intensity, brushId: st.brushId });
    }, 20);
  }
  function demo() {
    var names = ["Clay", "Standard", "Smooth", "Move", "Inflate", "Crease", "Flatten", "Pinch", "Layer", "Sharp Crease", "Nudge", "Snake Hook"];
    var s = { type: "state", tool: "Clay", brushId: "Clay", size: 0.55, sizeMinPx: 2, sizeMaxPx: 800, intensity: 0.42, mirror: { x: true }, desktop: "Studio PC",
              brushes: names.map(function (n) { return { id: n.replace(" ", ""), label: n }; }) };
    s.brushes[0].id = "Clay";
    if (DEMO === "pairing") return setPhase("pairing");
    if (DEMO === "connecting") { st.brushes = s.brushes; render(); return setPhase("connecting", { title: "Connecting to Studio PC", text: "If Chrome asks to let this page reach devices on your local network, tap Allow." }); }
    got = false; applyState(s);
    if (DEMO === "relay") { via = "relay"; setPhase("connected"); }
    else if (DEMO === "reconnecting") { deadline = Date.now() + 4 * 60 * 1000 + 52000; setPhase("reconnecting"); }
    else if (DEMO === "ended") setPhase("ended", { title: "Disconnected" });
    else if (DEMO === "error") setPhase("error", { title: "Can't reach Studio PC", text: "Check that this phone and the computer are on the same Wi‑Fi (not a guest network or VPN), then scan the new QR code.", main: ["Try again", function () {}] });
    else setPhase("connected");
  }

  // ---- First-run tour (skippable; the ? button opens it again) ----
  var TOUR_KEY = "sfdeck-tour", tourAt = -1, tourDone = false;
  var tourSteps = [
    { sel: "#tiles", title: "Pick a brush", text: "Tap a tile and your computer switches to that brush at once." },
    { sel: ".ctl", title: "Size and Intensity", text: "Drag anywhere on a strip. Slide your finger away from the strip as you drag for finer steps. Tap the number to type an exact value." },
    { sel: ".bar", title: "Undo, Redo, Mirror", text: "Big buttons for what you reach for most. Whatever you change on your computer shows up here too." },
    { sel: "header", title: "It stays connected", text: "If the Wi\u2011Fi drops, the Deck reconnects by itself for 5 minutes, with no new scan. Disconnect ends the session. Tap ? any time to see this again." }
  ];
  function tourSeen() { try { return localStorage.getItem(TOUR_KEY) === "1"; } catch (e) { return false; } }
  function tourPlace() {
    if (tourAt < 0) return;
    var t = tourSteps[tourAt], el = document.querySelector(t.sel), r = el.getBoundingClientRect(), pad = 6;
    var sp = $("tourSpot"), card = $("tourCard"), W = window.innerWidth, H = window.innerHeight;
    sp.style.left = (r.left - pad) + "px"; sp.style.top = (r.top - pad) + "px"; sp.style.width = (r.width + 2 * pad) + "px"; sp.style.height = (r.height + 2 * pad) + "px";
    card.style.left = card.style.right = card.style.top = card.style.bottom = "auto";
    var cw = card.offsetWidth, ch = card.offsetHeight, cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (W >= 640 && W > H) { // landscape: beside the controls, on the side the highlight isn't
      card.style.left = Math.max(12, cx > W / 2 ? 12 : W - cw - 12) + "px"; card.style.top = Math.max(12, (H - ch) / 2) + "px";
    } else { // portrait: the half of the screen the highlight isn't in
      card.style.left = Math.max(12, (W - cw) / 2) + "px";
      card.style.top = (cy > H / 2 ? Math.max(12, Math.min(r.top - ch - 18, 24)) : Math.max(12, H - ch - 24 - 12)) + "px";
    }
  }
  function tourShow(i) {
    tourAt = i; var t = tourSteps[i], last = i === tourSteps.length - 1;
    $("tour").classList.add("on");
    $("tourTitle").textContent = t.title; $("tourText").textContent = t.text;
    var count = $("tourCount"); count.textContent = "";
    for (var k = 0; k < tourSteps.length; k++) { var dot = document.createElement("i"); if (k === i) dot.className = "on"; count.appendChild(dot); }
    var label = document.createElement("span"); label.textContent = (i + 1) + " of " + tourSteps.length; count.appendChild(label);
    $("tourNext").textContent = last ? "Got it" : "Next"; $("tourSkip").classList.toggle("hidden", last);
    $("tourCard").style.visibility = "hidden"; tourPlace(); $("tourCard").style.visibility = "";
    $("tourCard").querySelector(".row").style.gridTemplateColumns = last ? "1fr" : "";
  }
  function tourClose(mark) {
    tourAt = -1; $("tour").classList.remove("on");
    if (mark) { try { localStorage.setItem(TOUR_KEY, "1"); } catch (e) {} }
  }
  function maybeTour() { if (!tourDone && tourAt < 0 && (DEMO ? DEMO === "tour" : !tourSeen())) { tourDone = true; tourShow(Math.max(0, Math.min(tourSteps.length - 1, +((location.hash.match(/[#&]step=(\d)/) || [])[1] || 1) - 1))); } }
  $("tourNext").onclick = function () { buzz(8); if (tourAt >= tourSteps.length - 1) tourClose(true); else tourShow(tourAt + 1); };
  $("tourSkip").onclick = function () { tourClose(true); };
  $("help").addEventListener("click", function () { buzz(8); tourDone = true; tourShow(0); });
  window.addEventListener("resize", tourPlace);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && tourAt >= 0) tourClose(true); });

  // ---- Start ----
  render();
  sizeCtl.show(0); intCtl.show(0);
  (async function () {
    if (DEMO) return demo();
    if (!token || !offer) return setPhase("pairing");
    if (!fresh) { // a reload within 5 minutes: the offer was used, so go straight to the relay
      deadline = Date.now() + 5 * 60 * 1000;
      setPhase("reconnecting"); // (before the relay can answer: a state arriving first must not be overwritten by the card)
      if (await startRelay("reload")) return guardRelay(5 * 60 * 1000);
      return setPhase("pairing");
    }
    if (typeof RTCPeerConnection === "undefined") {
      if (await startRelay("no-webrtc")) return;
      return setPhase("error", { title: "This browser can't connect", text: "Open this link in Chrome or Safari, then scan the code again." });
    }
    connectDirect().catch(function (e) {
      startRelay("failed").then(function (ok) { if (!ok) setPhase("error", { title: "Couldn't connect", text: String(e && e.message || e).slice(0, 120) + ". Scan the new QR code to try again." }); });
    });
  })();
})();
</script>
</body>
