name: Integrations

# The integration lanes (docs/design/release-lanes.md §2, docs/releasing.md "Integration releases"): the Blender
# add-on and the Maya script ship when they change, not with the app. A tag blender-vX.Y.Z or maya-vX.Y.Z (on main,
# whose file carries exactly that version) runs this: checks, the zip(s) and their SHA256SUMS.txt in a GitHub
# release of that name, never marked latest (the app's releases/latest stays the app), then the website again so
# its download links name the new release (pages.yml, step "Integration downloads"). No app version, update feed or
# package changes. What the two sides can read of each other is the bridge manifest's version, not the app's.

on:
  push:
    tags: ['blender-v[0-9]*', 'maya-v[0-9]*']

permissions:
  contents: write
  actions: write

concurrency:
  group: integrations-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check, build
        run: |
          tag=$GITHUB_REF_NAME; lane=${tag%%-v*}; V=${tag#*-v}
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$tag is not on main"; exit 1; }
          mkdir dist
          case $lane in
            blender)
              have=$(sed -n 's/^version = "\(.*\)"/\1/p' addons/blender/sculptforge_bridge/blender_manifest.toml)
              python3 addons/blender/build_addon.py --check --out dist
              [ "$have" != "$V" ] || cp "dist/sculptforge_bridge-$V.zip" dist/sculptforge_bridge.zip
              title="SculptForge Bridge for Blender $V" ;;
            maya)
              have=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' integrations/maya/sculptforge_maya.py)
              python3 -I tests/maya/test_sculptforge_maya.py   # mocked maya.cmds
              python3 -m zipfile -c dist/sculptforge_maya.zip integrations/maya/sculptforge_maya.py integrations/maya/README.md
              title="SculptForge for Maya $V" ;;
          esac
          [ "$have" = "$V" ] || { echo "::error::$tag but the file says $have: bump it on main first"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          { echo "lane=$lane"; echo "title=$title"; } >> "$GITHUB_ENV"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$title. Install and use: https://sculptforge.app/guide/$lane.html. Works with SculptForge releases that read bridge manifest version 1 or newer."
          gh release create "$GITHUB_REF_NAME" dist/* --title "$title" --notes "$notes" --latest=false --verify-tag
      - name: Website (download links name this release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
