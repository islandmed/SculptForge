name: Android

# The Android APK (android/README.md): scripts/android-build.sh on GitHub's runner, which has the SDK, an NDK, Java 17
# and Gradle. Branch and main runs make the tester APK (signed with the runner's throwaway debug key, so it installs).
# A `v*` tag run builds it unsigned and the job android-release-sign signs it with the permanent release key: the only job
# that reads the key, in the GitHub environment android-release (the owner approves each run; tags v* only), and it checks
# the certificate against scripts/android-cert.sha256. Read-only, pinned actions (tools/release/check_workflows.py).

on:
  push:
    branches: [main, 'feat/android']
    paths:
      - 'android/**'
      - 'scripts/android-build.sh'
      - '.github/workflows/android.yml'
      - 'src/render/GL.*'
      - 'src/app/NativeDialog.*'
      - 'src/app/main.cpp'
      - 'CMakeLists.txt'
      - 'cmake/**'
    tags: ['v*'] # (a tag push ignores the paths filter above)
  schedule:
    - cron: '17 9 * * *' # daily on main: any change to the shared code that breaks the Android build shows the next day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }} # (a release run waiting for the owner's approval is never cancelled)

jobs:
  apk:
    name: APK (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        # arm64: phones and tablets (Samsung, Lenovo, Xiaomi, OnePlus, Google, Amazon Fire...); x86_64: Chromebooks
        # with Intel/AMD and the emulator.
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          # (retries: a half-synced Ubuntu mirror fails one apt run now and then)
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ccache ninja-build >/dev/null && break; sleep 20; done
          command -v gradle && gradle --version | head -3
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
      - name: Compiler cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-android-${{ matrix.abi }}.${{ github.sha }}
          restore-keys: ccache-android-${{ matrix.abi }}.
      - name: Build
        shell: bash # (-o pipefail: a failed build fails here, not behind tee)
        # (a release tag: unsigned, for android-release-sign; every other run: the tester APK with the debug key)
        run: scripts/android-build.sh --abi ${{ matrix.abi }} --out build-android/${{ matrix.abi }} ${{ startsWith(github.ref, 'refs/tags/v') && '--unsigned' || '' }} | tee apk-path.txt
      - name: Compiler cache (save)
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-android-${{ matrix.abi }}.${{ github.sha }}
      - name: Check the APK
        run: |
          apk=$(tail -1 apk-path.txt)
          ls -l "$apk"
          unzip -l "$apk" | grep -E 'lib/${{ matrix.abi }}/lib(main|SDL3)\.so' | tee -a "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2 dump permissions "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sculptforge-android-${{ startsWith(github.ref, 'refs/tags/v') && 'unsigned' || 'test' }}-${{ matrix.abi }}
          path: build-android/${{ matrix.abi }}/*.apk
          retention-days: 14

  # Android release builds are signed with a stable key, so an update installs over the previous release build.
  # Runs on `v*` tag refs only (the environment's deployment rule says the same; the `if:` is the second lock), after the
  # owner approves the android-release deployment. The keystore and its password exist in this job only: decoded to
  # $RUNNER_TEMP with umask 077, the password passed through the environment (never an argument, never traced), the file
  # deleted at the end whatever happened.
  android-release-sign:
    name: Sign the release APKs
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sculptforge-android-unsigned-*
          path: unsigned
      - name: Sign
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ks="$RUNNER_TEMP/android-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
          mkdir -p signed
          shopt -s nullglob
          apks=(unsigned/*/*-unsigned.apk)
          [ "${#apks[@]}" -gt 0 ] || { echo "no unsigned APKs from the build job"; exit 1; }
          for apk in "${apks[@]}"; do
            out="signed/$(basename "${apk%-unsigned.apk}").apk"
            "$tools/zipalign" -f -p 16 "$apk" "$out.aligned"
            # (minSdk 28: v2 + v3 only, no v1)
            "$tools/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias sculptforge \
              --ks-pass env:ANDROID_KEY_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --min-sdk-version 28 --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --out "$out" "$out.aligned"
            rm -f "$out.aligned" "$out.idsig"
          done
      - name: Delete the keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-release.p12"
      - name: Check the certificate
        shell: bash
        run: |
          # (apksigner verify --print-certs on every APK; fails unless the SHA-256 is the pin in scripts/android-cert.sha256)
          scripts/android-verify.sh signed/*.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sculptforge-android-release
          path: signed/*.apk
          retention-days: 14

  # Every run that is not a `v*` tag proves the signing job did not start: no secret was ever offered to it.
  release-sign-skipped:
    name: Signing job skipped (not a release tag)
    needs: [apk, android-release-sign]
    if: always() && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: android-release-sign is skipped
        env:
          RESULT: ${{ needs.android-release-sign.result }}
        run: |
          echo "android-release-sign: $RESULT"
          [ "$RESULT" = skipped ]
