name: T0

# T0 of the test flow (docs/testing-flow.md) on GitHub's free runners, so branches don't queue for the PC: an agent
# pushes its branch to refs/heads/t0/<branch> (~/Work/.sf/t0-ci.sh does, and deletes the ref after). The run is jobs:
#   build   check_marks, the gallery gate, the build (compiler cache), the tests tools/test/impacted.py picks, and their split over
#           runners by measured duration (tools/ci/shard.py, tools/ci/test_costs.json); uploads the build folder (t0-tree)
#   test    N runners (a matrix sized by the plan: a few tests, one runner) each download the build and run their share
#   iwyu    tools/ci/iwyu_lite.py on the changed C++ files, next to the tests
#   verdict tools/ci/verdict.py merges them into the artifact t0-result (result.json, summary.md ...) t0-ci.sh and ready.sh read
# (CPU: Mesa llvmpipe, SDL offscreen; GITHUB_ACTIONS gives the time limits their CI slack.) Every job ends green: the verdict
# is the run summary and the artifact t0-result, so a red T0 emails nobody.
# On main (every push) it only builds, and saves the compiler cache ccache-t0-linux.<commit> every T0 starts from. A t0/release/**
# run (a release batch's T0, repeated all day) also saves ccache-t0rel-linux.<commit> when its build missed > 10% (caches are per
# branch: a t0/ ref reads its own and main's, so the next T0 of that ref starts from its own, then main's).
# Locked down (tools/release/check_workflows.py): pushes to main and t0/** only, contents: read, no secrets, pinned
# actions, no shell tracing; caches are saved from main and t0/release/** only, other t0/ runs only restore them.

on:
  push:
    branches: [main, 't0/**']

permissions:
  contents: read

concurrency:
  group: t0-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # main's cache build always finishes

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  CCACHE_DEPEND: 'true'
  SF_TEST_BUDGET: 150 # seconds per test, as ci.yml: software OpenGL on 4 cores
  SF_DEPS_CACHE: .deps
  SF_IWYU_CXX: g++-11 # the Ubuntu 22.04 packages' standard library (tools/ci/iwyu_lite.py, run by tools/ci/t0.sh)

jobs:
  build:
    name: T0 build
    runs-on: ubuntu-24.04
    timeout-minutes: 26 # measured max 17 (a cold release batch) + 50%
    continue-on-error: true # the verdict is the summary and t0-result: a red T0 (or a broken runner) emails nobody
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      iwyu: ${{ steps.plan.outputs.iwyu }}
      early: ${{ steps.plan.outputs.early }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # impacted.py: the merge base with origin/main and the last 600 commits' file lists
          filter: blob:none
      - name: Downloads (ci.yml's, restored only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .deps
          key: deps-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Fetch.cmake', '.github/workflows/ci.yml') }}
          restore-keys: deps-build-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13' # as ci.yml: the same compile lines, so main's compiler cache hits
      - name: Install dependencies
        run: |
          sudo ./packaging/linux/install-build-deps.sh >/dev/null
          sudo ./packaging/linux/apt-retry.sh install -y -qq --no-install-recommends ccache ninja-build libgl1-mesa-dri libegl1 mold g++-11 glslang-tools >/dev/null
          python -m pip install -q numpy pytest
      - name: Compiler cache (restore, this ref's then main's)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-t0rel-linux.${{ github.sha }}
          restore-keys: |
            ccache-t0rel-linux.
            ccache-t0-linux.
            ccache-ci-linux-x86_64.
      - name: Build (main; the cache for the T0 runs)
        if: github.ref == 'refs/heads/main'
        run: bash tools/ci/t0.sh --warm t0-result
      - name: Compiler cache (save; main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-t0-linux.${{ github.sha }}
      - name: Build, select the tests, plan the test jobs
        id: plan
        if: github.ref != 'refs/heads/main'
        run: bash tools/ci/t0.sh --build t0-plan
      - name: Compiler cache (save; a t0/release/** run that missed > 10%)
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/heads/t0/release/') && steps.plan.outputs.ccache_save == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-t0rel-linux.${{ github.sha }}
      - name: Pack the build for the test jobs
        if: ${{ steps.plan.outputs.early == 'false' }}
        run: |
          # Objects, precompiled headers and static libraries are only for linking: the tests run what is already linked.
          tar --use-compress-program='zstd -T0 -3' -cf t0-tree.tar.zst --exclude='*.o' --exclude='*.gch' --exclude='*.a' \
            --exclude='build/_deps/downloads/*' --exclude='build/ui-shots/*' build
          ls -l t0-tree.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.plan.outputs.early == 'false' }}
        with:
          name: t0-tree
          path: t0-tree.tar.zst
          retention-days: 1
          compression-level: 0 # already zstd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.ref != 'refs/heads/main'
        with:
          name: t0-plan
          path: t0-plan
          retention-days: 7

  test:
    name: T0 tests ${{ matrix.shard }}
    needs: build
    if: ${{ needs.build.outputs.shards != '' && needs.build.outputs.shards != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # measured max 23 (a red run with 50 failing cases) + 50%
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tests that read git history (the merge base with origin/main)
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          sudo ./packaging/linux/install-build-deps.sh >/dev/null
          sudo ./packaging/linux/apt-retry.sh install -y -qq --no-install-recommends libgl1-mesa-dri libegl1 glslang-tools >/dev/null
          python -m pip install -q numpy pytest
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t0-tree
          path: parts/t0-tree
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t0-plan
          path: parts/t0-plan
      - name: Unpack the build
        run: tar --use-compress-program=unzstd -xf parts/t0-tree/t0-tree.tar.zst
      - name: Tests (never fails; the verdict is the summary and t0-result)
        run: bash tools/ci/t0.sh --test ${{ matrix.shard }} parts/t0-plan t0-shard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: t0-shard-${{ matrix.shard }}
          path: t0-shard
          retention-days: 7

  iwyu:
    name: T0 iwyu
    needs: build
    if: ${{ needs.build.outputs.iwyu == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # measured 2
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          sudo ./packaging/linux/install-build-deps.sh >/dev/null
          sudo ./packaging/linux/apt-retry.sh install -y -qq --no-install-recommends g++-11 >/dev/null
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t0-tree
          path: parts/t0-tree
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t0-plan
          path: parts/t0-plan
      - name: Unpack the build
        run: tar --use-compress-program=unzstd -xf parts/t0-tree/t0-tree.tar.zst
      - name: iwyu_lite (never fails; the verdict is the summary and t0-result)
        run: bash tools/ci/t0.sh --iwyu parts/t0-plan t0-iwyu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: t0-iwyu
          path: t0-iwyu
          retention-days: 7

  verdict:
    name: T0 verdict
    needs: [build, test, iwyu]
    if: ${{ always() && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # measured < 1
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the plan and the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: t0-[psi]* # t0-plan, t0-shard-N, t0-iwyu (not the build)
          path: parts
      - name: Verdict (never fails; the verdict is the summary and t0-result)
        run: |
          bash tools/ci/t0.sh --verdict t0-result parts/t0-plan parts/t0-shard-* parts/t0-iwyu
          [ -f t0-result/summary.md ] && cat t0-result/summary.md >> "$GITHUB_STEP_SUMMARY"
          ls -l t0-result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: t0-result
          path: t0-result
          retention-days: 7
