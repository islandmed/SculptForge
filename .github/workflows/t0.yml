name: T0

# T0 of the test flow (docs/testing-flow.md) on GitHub's free runners, so branches don't queue for the PC: an agent
# pushes its branch to refs/heads/t0/<branch> (~/Work/.sf/t0-ci.sh does, and deletes the ref after), this builds it
# and runs tools/ci/t0.sh: check_marks, the build, the tests tools/test/impacted.py picks (CPU: Mesa llvmpipe, SDL
# offscreen; GITHUB_ACTIONS gives the time limits their CI slack). The verdict is the run summary and the artifact
# t0-result (result.json): the job itself always ends green, so a red T0 emails nobody.
# On main (every push) it only builds, and saves the compiler cache ccache-t0-linux.<commit> every T0 starts from
# (caches are per branch: a t0/ ref reads its own and main's; main's ci.yml runs mostly reuse staging's and build nothing).
# Locked down (tools/release/check_workflows.py): pushes to main and t0/** only, contents: read, no secrets, pinned
# actions, no shell tracing; caches are saved from main only, t0/ runs only restore them.

on:
  push:
    branches: [main, 't0/**']

permissions:
  contents: read

concurrency:
  group: t0-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # main's cache build always finishes

jobs:
  t0:
    name: T0
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true # the verdict is the summary and t0-result: a red T0 (or a broken runner) emails nobody
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      CCACHE_DEPEND: 'true'
      SF_TEST_BUDGET: 150 # seconds per test, as ci.yml: software OpenGL on 4 cores
      SF_DEPS_CACHE: .deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # impacted.py: the merge base with origin/main and the last 600 commits' file lists
          filter: blob:none
      # Main: a push whose every file is site lane (tools/ci/site_lane.txt, read from the commit before it, as ci.yml) builds
      # nothing: the next app push restores the newest ccache-t0-linux.* (11-11: site-data commits 3+/h kept main's queue
      # 10 deep and branch T0s waiting 30+ min). A new ref, a force push or a missing before commit builds.
      - name: Site lane (main)
        id: lane
        if: github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          site=false
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
             lane=$(git show "$BEFORE:tools/ci/site_lane.txt" 2>/dev/null); then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            appin=$(grep '^!' <<< "$lane" | cut -c2- || true)
            pat=$(grep -v -e '^#' -e '^!' -e '^[[:space:]]*$' <<< "$lane" || true)
            if [ -n "$files" ] && [ -n "$pat" ] && ! { [ -n "$appin" ] && grep -qE -f <(echo "$appin") <<< "$files"; } &&
               ! grep -qvE -f <(echo "$pat") <<< "$files"; then
              site=true; echo "::notice::site lane only (tools/ci/site_lane.txt): no build, no cache save"
            fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
      - name: Downloads (ci.yml's, restored only)
        if: steps.lane.outputs.site != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .deps
          key: deps-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Fetch.cmake', '.github/workflows/ci.yml') }}
          restore-keys: deps-build-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.lane.outputs.site != 'true'
        with:
          python-version: '3.13' # as ci.yml: the same compile lines, so main's compiler cache hits
      - name: Install dependencies
        if: steps.lane.outputs.site != 'true'
        run: |
          sudo ./packaging/linux/install-build-deps.sh >/dev/null
          sudo ./packaging/linux/apt-retry.sh install -y -qq --no-install-recommends ccache ninja-build libgl1-mesa-dri libegl1 mold >/dev/null
          python -m pip install -q numpy
      - name: Compiler cache (restore main's)
        if: steps.lane.outputs.site != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-t0-linux.${{ github.sha }}
          restore-keys: |
            ccache-t0-linux.
            ccache-ci-linux-x86_64.
      - name: Build (main; the cache for the T0 runs)
        if: github.ref == 'refs/heads/main' && steps.lane.outputs.site != 'true'
        run: bash tools/ci/t0.sh --warm t0-result
      - name: Compiler cache (save; main only)
        if: github.ref == 'refs/heads/main' && steps.lane.outputs.site != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-t0-linux.${{ github.sha }}
      - name: T0 (never fails; the verdict is the summary and t0-result)
        if: github.ref != 'refs/heads/main'
        run: |
          bash tools/ci/t0.sh t0-result
          cat t0-result/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.ref != 'refs/heads/main'
        with:
          name: t0-result
          path: t0-result
          retention-days: 7
