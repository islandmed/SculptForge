name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04 }
          - { name: Linux ARM64, os: ubuntu-24.04-arm }
          - { name: macOS, os: macos-14 }
          - { name: Windows, os: windows-2022 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo ./packaging/linux/install-build-deps.sh
      - name: NumPy for the Python API test
        run: python -m pip install numpy
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCULPTFORGE_USE_SYSTEM_SDL=OFF
          -DSCULPTFORGE_BUILD_PYTHON=ON -DPython_EXECUTABLE="${{ env.pythonLocation }}/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python3' }}"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test (C++ and Python API)
        run: ctest --test-dir build -C Release --output-on-failure -LE ui
      - name: UI tests (real app, Xvfb + Mesa)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1920x1080x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            ctest --test-dir build -C Release --output-on-failure -L ui
      - name: UI tests (real app, Mesa llvmpipe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner has no GPU driver: Mesa's software OpenGL (pal1000/mesa-dist-win), pinned by hash.
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          Invoke-WebRequest $url -OutFile mesa.7z
          if ((Get-FileHash mesa.7z -Algorithm SHA256).Hash -ne '351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695') {
            throw 'mesa3d archive hash mismatch'
          }
          7z e mesa.7z x64/opengl32.dll x64/libgallium_wgl.dll -obuild/Release -y | Out-Null
          $env:GALLIUM_DRIVER = 'llvmpipe'
          ctest --test-dir build -C Release --output-on-failure -L ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: UI test screenshots
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ui-shots-${{ matrix.os }}
          path: build/ui-shots
          if-no-files-found: ignore

  # The Blender add-on inside Blender itself (the bpy wheel is Blender as a Python module), against
  # sculptforge-cli: the oldest supported Blender (4.2 LTS, Python 3.11) and the newest.
  blender-addon:
    name: Blender add-on (bpy ${{ matrix.bpy }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bpy: '4.2.0', python: '3.11' }
          - { bpy: '5.2.3', python: '3.13' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo ./packaging/linux/install-build-deps.sh
      - name: bpy and numpy
        run: python -m pip install "bpy==${{ matrix.bpy }}" numpy
      - name: Build sculptforge-cli
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCULPTFORGE_USE_SYSTEM_SDL=OFF -DSCULPTFORGE_BUILD_APP=OFF
          cmake --build build --target sculptforge-cli --parallel 4
      - name: Add-on round trip in Blender
        run: python tests/blender/test_in_blender.py -- --cli build/sculptforge-cli
      - name: Add-on exchange code and package
        run: |
          python tests/blender/test_exchange.py --cli build/sculptforge-cli
          python addons/blender/build_addon.py --check --out build/blender-addon

  # VFX Reference Platform (vfxplatform.com): GCC 14.2 with glibc 2.28 (CY2026, EL8)
  # or glibc 2.34 (CY2027, EL9), C++20, Python 3.13.
  vfx-platform:
    name: VFX Reference Platform ${{ matrix.cy }} (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cy: CY2026, image: 'rockylinux:8', glibc: '2.28' }
          - { cy: CY2027, image: 'rockylinux:9', glibc: '2.34' }
    steps:
      - run: dnf -y install git
      - uses: actions/checkout@v7
      - run: ./packaging/linux/install-build-deps.sh
      - name: Python 3.13 (python-build-standalone via uv)
        run: |
          curl -LsSf https://astral.sh/uv/0.9.5/install.sh | sh
          ~/.local/bin/uv venv --python 3.13 /opt/py313
          ~/.local/bin/uv pip install --python /opt/py313/bin/python numpy
          echo "PYTHON313=/opt/py313/bin/python" >> "$GITHUB_ENV"
      - name: Build and test with GCC 14
        run: |
          source /opt/rh/gcc-toolset-14/enable
          gcc --version | head -1
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCULPTFORGE_USE_SYSTEM_SDL=OFF \
            -DSCULPTFORGE_BUILD_PYTHON=ON -DPython_EXECUTABLE="$PYTHON313"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure -LE ui
      - name: Check binary compatibility (glibc <= ${{ matrix.glibc }})
        run: |
          for f in build/sculptforge build/sculptforge-cli build/sculptforge*.so; do
            max=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
            echo "$f needs $max"
            [ "$(printf '%s\n' "GLIBC_${{ matrix.glibc }}" "$max" | sort -V | tail -1)" = "GLIBC_${{ matrix.glibc }}" ]
          done
