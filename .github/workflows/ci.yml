name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Compiler cache (ccache). Every job compiles through ccache and starts from the newest cache of the same job; ccache
# hashes the compiler and the preprocessed source with every flag, so a hit is the object file that compiler would
# produce, and anything changed compiles fresh. Caches are saved only by push and workflow_dispatch runs (main, or a
# maintainer's own branch): pull_request runs, forks included, only restore them (actions/cache/restore), so nothing a
# pull request builds can end up in another run. GitHub scopes caches by branch as well: a branch reads its own and
# main's, never another branch's. The release workflow uses no cache at all: release packages build from a clean tree.
# The suite runs as parallel ctest entries (sculptforge_tests is split into shards, CMakeLists.txt), every test as before.
# The Flatpak bundle check is in flatpak.yml.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04 }
          - { name: Linux ARM64, os: ubuntu-24.04-arm }
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2022 }
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo ./packaging/linux/install-build-deps.sh
          sudo apt-get install -y --no-install-recommends ccache xvfb libgl1-mesa-dri
      - name: ccache (macOS; the release binary, pinned by hash)
        if: runner.os == 'macOS'
        run: |
          curl -fsSLO https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz
          echo "cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  ccache-4.14.2-darwin.tar.gz" | shasum -a 256 -c
          tar xzf ccache-4.14.2-darwin.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
      - name: ccache (Windows; the release binary, pinned by hash, standing in for cl.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = 'ccache-4.14.2-windows-x86_64.zip'
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v4.14.2/$zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '6993CE645E53192CEC592EE23186200B574AC4C59097ECDE8D9CFD681B47AE84') {
            throw 'ccache archive hash mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $dir = "$env:RUNNER_TEMP\ccache-4.14.2-windows-x86_64"
          "$dir" >> $env:GITHUB_PATH
          # MSBuild runs "cl.exe" from CLToolPath (see Configure): ccache under that name, in a folder of its own, which
          # runs the real cl.exe from the PATH MSBuild sets up.
          $cl = "$env:RUNNER_TEMP\ccache-as-cl"
          New-Item -ItemType Directory $cl | Out-Null
          Copy-Item "$dir\ccache.exe" "$cl\cl.exe"
          "SF_CCACHE_CL=$($cl -replace '\\', '/')" >> $env:GITHUB_ENV
      - name: Compiler cache (restore)
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-
      - name: NumPy for the Python API test
        run: python -m pip install numpy
      - name: Configure
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCULPTFORGE_USE_SYSTEM_SDL=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DSCULPTFORGE_BUILD_PYTHON=ON -DPython_EXECUTABLE="${{ env.pythonLocation }}/bin/python3"
      - name: Configure (Visual Studio generator, as the release builds; ccache as cl.exe, one compiler per file)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCULPTFORGE_USE_SYSTEM_SDL=OFF
          -DCMAKE_VS_GLOBALS="CLToolExe=cl.exe;CLToolPath=${{ env.SF_CCACHE_CL }};TrackFileAccess=false;UseMultiToolTask=true;EnforceProcessCountAcrossBuilds=true"
          -DSCULPTFORGE_BUILD_PYTHON=ON -DPython_EXECUTABLE="${{ env.pythonLocation }}/python.exe"
      - name: Build
        run: |
          ccache -z
          cmake --build build --config Release --parallel 4
          ccache -s -v
      - name: Compiler cache (save; not from pull requests)
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
      # Every test in one parallel ctest run (UI tests too, where there is a display), so no core idles while the
      # last tests of one group finish.
      - name: Test (C++, Python API, UI tests with Xvfb + Mesa)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            ctest --test-dir build -C Release --output-on-failure -j 4
      - name: Test (C++ and Python API; UI tests need a display)
        if: runner.os == 'macOS'
        run: ctest --test-dir build -C Release --output-on-failure -LE ui -j 4
      - name: Test (C++, Python API, UI tests with Mesa llvmpipe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner has no GPU driver: Mesa's software OpenGL (pal1000/mesa-dist-win), pinned by hash.
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          Invoke-WebRequest $url -OutFile mesa.7z
          if ((Get-FileHash mesa.7z -Algorithm SHA256).Hash -ne '351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695') {
            throw 'mesa3d archive hash mismatch'
          }
          7z e mesa.7z x64/opengl32.dll x64/libgallium_wgl.dll -obuild/Release -y | Out-Null
          $env:GALLIUM_DRIVER = 'llvmpipe'
          ctest --test-dir build -C Release --output-on-failure -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: UI test screenshots
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ui-shots-${{ matrix.os }}
          path: build/ui-shots
          if-no-files-found: ignore

  # The Blender add-on inside Blender itself (the bpy wheel is Blender as a Python module), against
  # sculptforge-cli: the oldest supported Blender (4.2 LTS, Python 3.11) and the newest.
  blender-addon:
    name: Blender add-on (bpy ${{ matrix.bpy }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bpy: '4.2.0', python: '3.11' }
          - { bpy: '5.2.3', python: '3.13' }
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: |
          sudo ./packaging/linux/install-build-deps.sh
          sudo apt-get install -y --no-install-recommends ccache
      - name: Compiler cache (restore)
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-blender-cli-${{ matrix.bpy }}-${{ github.sha }}
          restore-keys: ccache-blender-cli-${{ matrix.bpy }}-
      - name: bpy and numpy
        run: python -m pip install "bpy==${{ matrix.bpy }}" numpy
      - name: Build sculptforge-cli
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCULPTFORGE_USE_SYSTEM_SDL=OFF -DSCULPTFORGE_BUILD_APP=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target sculptforge-cli --parallel 4
          ccache -s -v
      - name: Compiler cache (save; not from pull requests)
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-blender-cli-${{ matrix.bpy }}-${{ github.sha }}
      - name: Add-on round trip in Blender
        run: python tests/blender/test_in_blender.py -- --cli build/sculptforge-cli
      - name: Add-on exchange code and package
        run: |
          python tests/blender/test_exchange.py --cli build/sculptforge-cli
          python addons/blender/build_addon.py --check --out build/blender-addon

  # VFX Reference Platform (vfxplatform.com): GCC 14.2 with glibc 2.28 (CY2026, EL8)
  # or glibc 2.34 (CY2027, EL9), C++20, Python 3.13.
  vfx-platform:
    name: VFX Reference Platform ${{ matrix.cy }} (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cy: CY2026, image: 'rockylinux:8', glibc: '2.28' }
          - { cy: CY2027, image: 'rockylinux:9', glibc: '2.34' }
    steps:
      - run: dnf -y install git tar gzip zstd # zstd: actions/cache compresses with it (gzip is several times slower)
      - uses: actions/checkout@v7
      - run: ./packaging/linux/install-build-deps.sh
      - name: ccache (the static release binary, pinned by hash)
        run: |
          curl -fsSLO https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-linux-x86_64-musl-static.tar.gz
          echo "d540ba01f160addbd3dd5e18eda9bd34005591b095c09ac8ae9d0a1b655e7ef5  ccache-4.14.2-linux-x86_64-musl-static.tar.gz" | sha256sum -c
          tar xzf ccache-4.14.2-linux-x86_64-musl-static.tar.gz -C /opt
          echo "/opt/ccache-4.14.2-linux-x86_64-musl-static" >> "$GITHUB_PATH"
          # (In a container job the github.workspace expression gives the host's path; $GITHUB_WORKSPACE is the container's.)
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Compiler cache (restore)
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.cy }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.cy }}-
      - name: Python 3.13 (python-build-standalone via uv)
        run: |
          curl -LsSf https://astral.sh/uv/0.9.5/install.sh | sh
          ~/.local/bin/uv venv --python 3.13 /opt/py313
          ~/.local/bin/uv pip install --python /opt/py313/bin/python numpy
          echo "PYTHON313=/opt/py313/bin/python" >> "$GITHUB_ENV"
      - name: Build with GCC 14
        run: |
          source /opt/rh/gcc-toolset-14/enable
          gcc --version | head -1
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCULPTFORGE_USE_SYSTEM_SDL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSCULPTFORGE_BUILD_PYTHON=ON -DPython_EXECUTABLE="$PYTHON313"
          ccache -z
          cmake --build build --parallel 4
          ccache -s -v
      - name: Compiler cache (save; not from pull requests)
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.cy }}-${{ github.sha }}
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE ui -j 4
      - name: Check binary compatibility (glibc <= ${{ matrix.glibc }})
        run: |
          for f in build/sculptforge build/sculptforge-cli build/sculptforge*.so; do
            max=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
            echo "$f needs $max"
            [ "$(printf '%s\n' "GLIBC_${{ matrix.glibc }}" "$max" | sort -V | tail -1)" = "GLIBC_${{ matrix.glibc }}" ]
          done
