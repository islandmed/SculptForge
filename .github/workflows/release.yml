name: Release

# A v* tag publishes a GitHub release (docs/releasing.md has the whole process; scripts/release.sh drives it).
#
#   locate   the tagged commit must carry the version the tag names (CMakeLists.txt's version, plus its
#            SCULPTFORGE_PRERELEASE for a beta: v0.11.0-beta.1 tags 0.11.0 with "beta.1"). When the Packages workflow
#            (packages.yml) ran on a maintainer's push to `staging` for exactly this commit (scripts/release.sh --stage),
#            the release promotes that run's packages unchanged: built and tested once. tools/release/staged_run.py
#            picks it (push event, branch, actor, success, at most 7 days old, artifacts present) and refuses the
#            release if no such run qualifies; CI must have passed on main for the commit. With no staging run at all:
#   build    the Packages workflow runs here, from the tag (compiler cache restored from main, never saved): the
#            --rebuild path.
#   verify   every package's SHA-256 is the one its run recorded (packages.yml job sums) and its GitHub artifact
#            attestation names packages.yml, this commit and that run (and, promoted, a push to staging):
#            tools/release/verify_staged.py. Any mismatch refuses the release.
#   smoke    every package installed or unpacked on a fresh runner: the app opens a model and sculpts
#            (tests/ui/release_smoke.sfui), sculptforge-cli opens, sculpts, saves and reopens and its MCP server answers
#            (tests/release_smoke.py), also through the AppImage (AppRun --cli) and each unpacked .mcpb bundle.
#   publish  only after verify and every smoke test passed (environment `release`, the only holder of
#            UPDATE_SIGNING_KEY besides member-release: tags v* only): checksums re-checked, signed, notes from
#            CHANGELOG.md, the GitHub release. A tag with
#            a '-' (a beta) is a member perk, published by publish-members instead: a pre-release in the private
#            repository islandmed/sculptforge-insiders (INSIDERS_REPO_TOKEN, held only by the environment
#            member-release: v* tags only, maintainer approval) with CHANGELOG's [Unreleased] notes, and posted in
#            #members (DISCORD_MEMBERS_WEBHOOK). Nothing public: no release here, no update feed entry.
#
# Only publish holds a GitHub token that can write (contents: write); every other job reads. Every action is pinned
# to a full commit SHA (scripts/release.sh check enforces it). Build and smoke jobs take their
# runner from the SF_RUNNER_* repository variables (standard GitHub runners when unset); locate and publish always run
# on GitHub's own runners.
# workflow_dispatch republishes an existing tag (dispatch it ON the tag, `--ref vX.Y.Z`: the environment takes only
# tags); dry_run does everything but publish, and promote_run (dry runs only) smoke-tests the packages of any Packages
# run, unverified, so the pipeline can be tried from a branch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0 (a dry run also takes a branch or commit)
        required: true
      dry_run:
        description: Everything but publishing
        type: boolean
        default: false
      promote_run:
        description: (dry runs only) smoke-test the packages of this Packages or Release run id
        required: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  locate:
    name: Locate tested packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
      sha: ${{ steps.find.outputs.sha }}
      tag: ${{ steps.find.outputs.tag }}
      staged: ${{ steps.find.outputs.staged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', fetch-depth: 20 } # the commits before the bump, for the paperwork check
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROMOTE_RUN: ${{ inputs.promote_run }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^project(SculptForge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          pre=$(sed -n 's/^set(SCULPTFORGE_PRERELEASE "\([^"]*\)")$/\1/p' CMakeLists.txt)
          version=$version${pre:+-$pre} # a beta: 0.11.0-beta.1
          if [ "$DRY_RUN" = true ] && ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # A dry run of a branch or commit: its packages are named for the version it carries.
            echo "Dry run of $TAG ($sha), packages named v$version"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          elif [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG tags a commit whose CMakeLists.txt says $version (version and SCULPTFORGE_PRERELEASE). Fix: delete the tag, bump the version (scripts/release.sh, or tag v$version), tag again."
            exit 1
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DRY_RUN" = true ] && [ -n "$PROMOTE_RUN" ]; then
            run=$(gh api "repos/$REPO/actions/runs/$PROMOTE_RUN" \
                  --jq 'select((.path == ".github/workflows/packages.yml" or .path == ".github/workflows/release.yml")
                                and .conclusion == "success") | .id')
            [ -n "$run" ] || { echo "::error::$PROMOTE_RUN is not a successful Packages (or Release) run"; exit 1; }
            echo "Dry run: smoke-testing the packages of run $run (not of $sha)"
            echo "run-id=$run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CI: a successful run on a push to main for exactly this commit, from this repository's own workflow file.
          runs() {
            gh api "repos/$REPO/actions/workflows/$1/runs?head_sha=$sha&event=push&branch=main&status=success&per_page=5" \
              --jq '.workflow_runs[] | select(.head_sha == "'"$sha"'" and .head_branch == "main" and .event == "push"
                    and .path == ".github/workflows/'"$1"'" and .head_repository.full_name == "'"$REPO"'") | .id' | head -1
          }
          # The packages: only the Packages run of a maintainer's push to `staging` for exactly this commit (exit 3:
          # there is none, build here; exit 1: there are runs, none may be promoted: refuse).
          rc=0
          pkg=$(python3 tools/release/staged_run.py --repo "$REPO" --sha "$sha") || rc=$?
          if [ $rc = 3 ]; then
            echo "No Packages run on staging for $sha: building the packages here (the --rebuild path)"
            exit 0
          elif [ $rc != 0 ]; then
            echo "::error::$sha has Packages runs on staging but none may be promoted (above). Fix: stage the release again (scripts/release.sh X.Y.Z --stage), or delete the tag and use scripts/release.sh X.Y.Z --rebuild."
            exit 1
          fi
          ci=$(runs ci.yml || true)
          if [ -z "$ci" ]; then
            # The bump commit adds only release paperwork (tools/release/paperwork_only.py: version lines, CHANGELOG,
            # docs, site, fragments) to a main commit whose CI passed: that result stands (scripts/release.sh step ci).
            for c in $(git rev-list --first-parent -n 8 "$sha~1"); do
              python3 tools/release/paperwork_only.py "$c" "$sha" || break
              ci=$(sha=$c; runs ci.yml || true)
              [ -n "$ci" ] && { echo "CI run $ci on $c stands for $sha (only release paperwork since)"; break; }
            done
          fi
          [ -n "$ci" ] || { echo "::error::no successful CI run on main for $sha: a staged commit lands on main only after CI passed"; exit 1; }
          echo "Promoting the packages of staging's Packages run $pkg (CI run $ci passed for $sha)"
          echo "run-id=$pkg" >> "$GITHUB_OUTPUT"
          echo "staged=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: locate
    if: needs.locate.outputs.run-id == ''
    permissions:
      contents: read
      actions: read # packages.yml's reuse job asks for it (it skips itself here: not a push to main)
      id-token: write # packages.yml attests what it builds
      attestations: write
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ needs.locate.outputs.sha }}
      tag: ${{ needs.locate.outputs.tag }}

  # Every package against its run's recorded SHA-256 and its attestation (tools/release/verify_staged.py). Dry runs
  # too; not for promote_run (a dry run's look at any run's packages).
  verify:
    name: Verify checksums and attestations
    needs: [locate, build]
    if: ${{ !cancelled() && needs.locate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && !(inputs.dry_run == true && inputs.promote_run != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ needs.locate.outputs.sha }}', persist-credentials: false, sparse-checkout: tools/release }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: '{linux,flatpak,vfx,macos,windows}*'
          run-id: ${{ needs.locate.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged-sums
          path: sums
          run-id: ${{ needs.locate.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.locate.outputs.run-id || github.run_id }}
          SHA: ${{ needs.locate.outputs.sha }}
          STAGED: ${{ needs.locate.outputs.staged }}
        run: python3 tools/release/verify_staged.py dist sums/SHA256SUMS.staged.txt --repo "$GITHUB_REPOSITORY" --run "$RUN" --sha "$SHA" ${STAGED:+--staged}

  smoke:
    name: Smoke test ${{ matrix.name }}
    needs: [locate, build]
    if: ${{ !cancelled() && needs.locate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    permissions:
      contents: read
      actions: read # the packages may be another run's artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows installer and .zip, kind: windows, artifact: windows, os: "${{ vars.SF_RUNNER_WIN || 'windows-2022' }}" }
          - { name: macOS .dmg, kind: macos, artifact: macos, os: "${{ vars.SF_RUNNER_MAC || 'macos-15' }}" }
          - { name: Linux x86_64 .deb and AppImage, kind: linux, artifact: linux-x86_64, os: "${{ vars.SF_RUNNER_LINUX || 'ubuntu-24.04' }}" }
          - { name: Linux arm64 .deb and AppImage, kind: linux, artifact: linux-arm64, os: "${{ vars.SF_RUNNER_LINUX_ARM || 'ubuntu-24.04-arm' }}" }
          - { name: .rpm (Rocky Linux 9), kind: rpm, artifact: vfx-vfx2026-x86_64, os: "${{ vars.SF_RUNNER_LINUX || 'ubuntu-24.04' }}", image: 'rockylinux:9' }
    steps:
      - if: matrix.kind == 'rpm'
        run: dnf -y install git tar python3 xorg-x11-server-Xvfb mesa-dri-drivers
      # The smoke scripts and the test model come from the workflow's own commit (the tag, when a tag runs this).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests/release_smoke.py
            tests/ui/release_smoke.sfui
            tests/data/marble-bust.glb
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: pkg
          run-id: ${{ needs.locate.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Windows installer (silent) and .zip
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem pkg/SculptForge-*-windows-x86_64.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S', '/D=C:\SFInstalled' -Wait
          Expand-Archive (Get-ChildItem pkg/SculptForge-*-windows-x86_64.zip | Select-Object -First 1).FullName -DestinationPath zip
          $zipbin = (Get-ChildItem zip -Recurse -Filter sculptforge.exe | Select-Object -First 1).DirectoryName
          # No GPU driver on the runner: Mesa's software OpenGL (pal1000/mesa-dist-win), pinned by hash, next to the exe.
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          Invoke-WebRequest $url -OutFile mesa.7z
          if ((Get-FileHash mesa.7z -Algorithm SHA256).Hash -ne '351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695') {
            throw 'mesa3d archive hash mismatch'
          }
          $env:GALLIUM_DRIVER = 'llvmpipe'
          foreach ($bin in @('C:\SFInstalled\bin', $zipbin)) {
            Write-Host "== $bin"
            7z e mesa.7z x64/opengl32.dll x64/libgallium_wgl.dll "-o$bin" -y | Out-Null
            & "$bin\sculptforge.exe" --ui-test "$PWD\tests\ui\release_smoke.sfui" --ui-out "$PWD\shots\$(Split-Path $bin -Leaf)"
            if ($LASTEXITCODE -ne 0) { throw "the app's smoke test failed in $bin" }
            python tests/release_smoke.py --cli "$bin\sculptforge-cli.exe" --out "smoke-$(Split-Path $bin -Leaf)"
            if ($LASTEXITCODE -ne 0) { throw "the CLI smoke test failed in $bin" }
          }
          Copy-Item (Get-ChildItem pkg/SculptForge-*-windows-x86_64.mcpb | Select-Object -First 1).FullName mcpb.zip # (Expand-Archive wants .zip)
          Expand-Archive mcpb.zip -DestinationPath mcpb
          python tests/release_smoke.py --mcp-only --cli "$PWD\mcpb\server\sculptforge-cli.exe"
          if ($LASTEXITCODE -ne 0) { throw "the .mcpb bundle's server failed" }
      - name: macOS .dmg
        if: matrix.kind == 'macos'
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" pkg/*.dmg
          cp -R "$mnt/SculptForge.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          app="$RUNNER_TEMP/SculptForge.app/Contents/MacOS"
          codesign --verify --deep "$RUNNER_TEMP/SculptForge.app"
          python3 tests/release_smoke.py --cli "$app/sculptforge-cli" --out smoke
          unzip -q pkg/*.mcpb -d mcpb && python3 tests/release_smoke.py --mcp-only --cli mcpb/server/sculptforge-cli
          "$app/sculptforge" --ui-test "$PWD/tests/ui/release_smoke.sfui" --ui-out "$PWD/shots"
      - name: Linux .deb and AppImage
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./pkg/sculptforge_*.deb xvfb libgl1-mesa-dri
          ui() { xvfb-run -a -s "-screen 0 1920x1080x24" env LIBGL_ALWAYS_SOFTWARE=1 "$@" \
                   --ui-test "$PWD/tests/ui/release_smoke.sfui"; }
          echo "== .deb"
          ui /usr/bin/sculptforge --ui-out "$PWD/shots/deb"
          python3 tests/release_smoke.py --cli /usr/bin/sculptforge-cli --out smoke-deb
          echo "== AppImage (extracted: runners have no FUSE)"
          chmod +x pkg/*.AppImage
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/pkg/*.AppImage --appimage-extract >/dev/null)
          ui "$RUNNER_TEMP/squashfs-root/AppRun" --ui-out "$PWD/shots/appimage"
          python3 tests/release_smoke.py --cli "$RUNNER_TEMP/squashfs-root/usr/bin/sculptforge-cli" --out smoke-appimage
          echo "== AppRun --cli --mcp (what Help > Connect an AI tool gives AppImage users)"
          python3 tests/release_smoke.py --mcp-only --cli "$RUNNER_TEMP/squashfs-root/AppRun --cli"
          echo "== .mcpb"
          unzip -q pkg/*.mcpb -d mcpb && python3 tests/release_smoke.py --mcp-only --cli mcpb/server/sculptforge-cli
      - name: .rpm
        if: matrix.kind == 'rpm'
        run: |
          dnf -y install ./pkg/sculptforge-*.rpm
          python3 tests/release_smoke.py --cli /usr/bin/sculptforge-cli --out smoke-rpm
          Xvfb :99 -screen 0 1920x1080x24 & sleep 2
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/sculptforge \
            --ui-test "$PWD/tests/ui/release_smoke.sfui" --ui-out "$PWD/shots/rpm"
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-shots-${{ matrix.artifact }}
          path: shots
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    needs: [locate, build, verify, smoke]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.smoke.result == 'success' && inputs.dry_run != true && !contains(needs.locate.outputs.tag, '-') }}
    runs-on: ubuntu-24.04
    environment: release # UPDATE_SIGNING_KEY lives only here (and in member-release): deployments from tags v* only
    permissions:
      contents: write
      actions: read
    env:
      HAS_REPO_KEY: ${{ secrets.REPO_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: '{linux,flatpak,vfx,macos,windows}*'
          run-id: ${{ needs.locate.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged-sums
          path: sums
          run-id: ${{ needs.locate.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: The same bytes job verify checked (SHA-256 as recorded, nothing added or missing)
        env:
          RUN: ${{ needs.locate.outputs.run-id || github.run_id }}
          SHA: ${{ needs.locate.outputs.sha }}
        run: python3 tools/release/verify_staged.py dist sums/SHA256SUMS.staged.txt --run "$RUN" --sha "$SHA" --sums-only && rm -r sums
      - name: Version-less copies (fixed links such as releases/latest/download/SculptForge-macos.dmg)
        run: |
          cd dist
          V=${TAG#v}
          cp "SculptForge-$V-windows-x86_64.exe" SculptForge-windows-x86_64-setup.exe
          cp "SculptForge-$V-windows-x86_64.zip" SculptForge-windows-x86_64-portable.zip
          cp "SculptForge-$V-darwin-universal.dmg" SculptForge-macos.dmg
          cp "SculptForge-$V-x86_64.AppImage" SculptForge-linux-x86_64.AppImage
          cp "SculptForge-$V-aarch64.AppImage" SculptForge-linux-arm64.AppImage
          cp "sculptforge_${V}_amd64.deb" sculptforge_amd64.deb
          cp "sculptforge_${V}_arm64.deb" sculptforge_arm64.deb
          cp "sculptforge-$V-1.x86_64.rpm" sculptforge.x86_64.rpm
          cp "sculptforge-$V-1.aarch64.rpm" sculptforge.aarch64.rpm
          cp "SculptForge-$V-x86_64.flatpak" SculptForge-linux-x86_64.flatpak
          cp "SculptForge-$V-aarch64.flatpak" SculptForge-linux-arm64.flatpak
          cp "SculptForge-$V-windows-x86_64.mcpb" SculptForge-windows-x86_64.mcpb
          cp "SculptForge-$V-darwin-universal.mcpb" SculptForge-macos.mcpb
          cp "SculptForge-$V-linux-x86_64.mcpb" SculptForge-linux-x86_64.mcpb
          cp "SculptForge-$V-linux-arm64.mcpb" SculptForge-linux-arm64.mcpb
      - name: MCP registry entry (server.json for the .mcpb bundles; publishing it is the maintainer's, docs/releasing.md)
        run: python3 tools/release/mcp_server_json.py --version "${TAG#v}" --dist dist
      - name: Blender add-on (extension and legacy zips, plus a version-less copy for the website's link)
        run: |
          V=${TAG#v}
          python3 addons/blender/build_addon.py --check --version "$V" --out dist
          cp "dist/sculptforge_bridge-$V.zip" dist/sculptforge_bridge.zip
      - name: Maya shelf script (Python source and its README; nothing to build)
        run: python3 -m zipfile -c dist/sculptforge_maya.zip integrations/maya/sculptforge_maya.py integrations/maya/README.md
      - name: Software bill of materials (CycloneDX; covered by the checksums and their signature)
        run: python3 tools/release/sbom.py --version "${TAG#v}" --out "dist/SculptForge-${TAG#v}-sbom.cdx.json"
      # The apt and dnf repositories (sculptforge.app/apt and /rpm, docs/design/package-repos.md): signed metadata for
      # this release's .deb and .rpm, put on the site by pages.yml. Skipped until the REPO_SIGNING_KEY secret exists
      # in this environment. The tools are installed in their own step, which never sees the key.
      - name: Repository tools
        if: ${{ env.HAS_REPO_KEY == 'true' }}
        run: sudo apt-get update -q && sudo apt-get install -y -q createrepo-c apt-utils
      - name: Signed apt and dnf repository metadata
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$REPO_SIGNING_KEY" ]; then echo "No REPO_SIGNING_KEY secret: no package repositories for this release"; exit 0; fi
          tools/publish/package_repos.sh dist dist/sculptforge-package-repos.tar.gz
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign the checksums (one-click update checks SHA256SUMS.txt.sig, src/core/SelfUpdate.h)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: tools/release/sign_sums.sh dist
      - name: Release notes from CHANGELOG
        run: |
          awk -v h="## [${TAG#v}]" 'index($0, h) == 1 {flag=1;next} /^## \[/{flag=0} flag' CHANGELOG.md > notes.md
          cat packaging/release-notes-footer.md >> notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SculptForge ${TAG#v}" --notes-file notes.md
          gh release upload "$TAG" dist/* --clobber

  # A beta (a tag with a '-') is a member perk, published only in the private repository islandmed/sculptforge-insiders.
  # INSIDERS_REPO_TOKEN lives only in the GitHub Environment "member-release" (deployment: tags v* only; the maintainer
  # approves each run), so no other job, workflow or branch can read it. This job's GitHub token only reads; the
  # insiders token reaches exactly one step, as an env var. Runs only for the tag push itself (the environment refuses
  # a workflow_dispatch from a branch); scripts/release.sh check enforces the environment and pinned actions.
  publish-members:
    name: Publish members' beta
    needs: [locate, build, verify, smoke]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.smoke.result == 'success' && inputs.dry_run != true && contains(needs.locate.outputs.tag, '-') }}
    runs-on: ubuntu-24.04
    environment: member-release
    permissions:
      contents: read
      actions: read # the packages may be another run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.TAG }}', persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: '{linux,flatpak,vfx,macos,windows}*'
          run-id: ${{ needs.locate.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged-sums
          path: sums
          run-id: ${{ needs.locate.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: The same bytes job verify checked (SHA-256 as recorded, nothing added or missing)
        env:
          RUN: ${{ needs.locate.outputs.run-id || github.run_id }}
          SHA: ${{ needs.locate.outputs.sha }}
        run: python3 tools/release/verify_staged.py dist sums/SHA256SUMS.staged.txt --run "$RUN" --sha "$SHA" --sums-only && rm -r sums
      - name: Blender add-on and Maya shelf script
        run: |
          V=${TAG#v}
          V=${V%%-*} # a beta's packages carry its version without the prerelease (the app shows it)
          python3 addons/blender/build_addon.py --check --version "$V" --out dist
          python3 -m zipfile -c dist/sculptforge_maya.zip integrations/maya/sculptforge_maya.py integrations/maya/README.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign the checksums (one-click update checks SHA256SUMS.txt.sig, src/core/SelfUpdate.h)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: tools/release/sign_sums.sh dist
      - name: Release notes (CHANGELOG's [Unreleased])
        run: |
          printf '%s\n\n' "**Members' beta.** Thank you for being a member! Please report problems in #members on Discord (or a GitHub issue) with your OS, this version (Help > About) and your graphics card." > notes.md
          awk -v h="## [Unreleased]" 'index($0, h) == 1 {flag=1;next} /^## \[/{flag=0} flag' CHANGELOG.md >> notes.md
          cat packaging/release-notes-footer.md >> notes.md
      - name: Pre-release in islandmed/sculptforge-insiders
        env:
          GH_TOKEN: ${{ secrets.INSIDERS_REPO_TOKEN }}
          GH_REPO: islandmed/sculptforge-insiders
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::No INSIDERS_REPO_TOKEN in the member-release environment"; exit 1; }
          pre=${TAG#*-}
          title="SculptForge ${TAG%%-*} $(sed -E 's/^rc/RC/; s/^./\U&/; s/\./ /g' <<<"$pre")" # v0.11.0-beta.1: "SculptForge 0.11.0 Beta 1"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "${title/SculptForge v/SculptForge }" --notes-file notes.md --prerelease --latest=false
          gh release upload "$TAG" dist/* --clobber
      - name: Post the beta in #members
        env:
          WEBHOOK: ${{ secrets.DISCORD_MEMBERS_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::No DISCORD_MEMBERS_WEBHOOK secret: post the beta in #members by hand"; exit 0; fi
          pre=${TAG#*-}
          label="${TAG%%-*} $(sed -E 's/^rc/RC/; s/^./\U&/; s/\./ /g' <<<"$pre")"
          url="https://github.com/islandmed/sculptforge-insiders/releases/tag/$TAG"
          jq -n --arg c "**SculptForge ${label#v} is up for members:** $url
          Please report anything that goes wrong here, with your OS and graphics card. Not invited to the repository yet? Reply with your GitHub username." \
            '{content: $c, allowed_mentions: {parse: []}, flags: 4}' |
            curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK" >/dev/null
          echo "Posted to #members"
