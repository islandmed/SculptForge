name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (.deb, AppImage, .tar.gz)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-22.04, ld: x86_64 }
          - { arch: arm64, os: ubuntu-22.04-arm, ld: aarch64 }
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - run: sudo ./packaging/linux/install-build-deps.sh
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DSCULPTFORGE_USE_SYSTEM_SDL=OFF
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure -LE ui
      - name: UI tests (real app, Xvfb + Mesa)
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1920x1080x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            ctest --test-dir build --output-on-failure -L ui
      - name: .deb and .tar.gz
        run: cd build && cpack -G "DEB;TGZ"
      - name: AppImage
        run: |
          DESTDIR=$PWD/AppDir cmake --install build
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.ld }}.AppImage
          chmod +x linuxdeploy
          # Named the AppImage way (SculptForge-1.2.3-x86_64.AppImage, no "linux"), with update information so
          # AppImageUpdate and similar tools can update it from the newest GitHub release (the .zsync file).
          export LDAI_OUTPUT="SculptForge-${TAG#v}-${{ matrix.ld }}.AppImage"
          export LDAI_UPDATE_INFORMATION="gh-releases-zsync|islandmed|SculptForge|latest|SculptForge-*-${{ matrix.ld }}.AppImage.zsync"
          VERSION=${TAG#v} ./linuxdeploy --appimage-extract-and-run --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/org.sculptforge.SculptForge.desktop \
            --icon-file assets/branding/sculptforge-256.png --icon-filename org.sculptforge.SculptForge \
            --output appimage
          mv "$LDAI_OUTPUT" "$LDAI_OUTPUT.zsync" build/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.tar.gz
            build/*.AppImage
            build/*.AppImage.zsync

  vfx:
    name: ${{ matrix.label }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CY2026: EL8 / glibc 2.28 also gives the .rpm for RHEL 8, 9, 10 and Fedora.
          - { label: 'RPM + VFX CY2026', suffix: vfx2026, generators: 'RPM;TGZ', image: 'rockylinux:8', arch: x86_64, os: ubuntu-24.04 }
          - { label: 'RPM + VFX CY2026', suffix: vfx2026, generators: 'RPM;TGZ', image: 'rockylinux:8', arch: arm64, os: ubuntu-24.04-arm }
          - { label: 'VFX CY2027', suffix: vfx2027, generators: 'TGZ', image: 'rockylinux:9', arch: x86_64, os: ubuntu-24.04 }
          - { label: 'VFX CY2027', suffix: vfx2027, generators: 'TGZ', image: 'rockylinux:9', arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - run: dnf -y install git
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - run: ./packaging/linux/install-build-deps.sh
      - name: Python 3.13
        run: |
          curl -LsSf https://astral.sh/uv/0.9.5/install.sh | sh
          ~/.local/bin/uv venv --python 3.13 /opt/py313
          ~/.local/bin/uv pip install --python /opt/py313/bin/python numpy
          echo "PYTHON313=/opt/py313/bin/python" >> "$GITHUB_ENV"
      - name: Build, test and package with GCC 14
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DSCULPTFORGE_USE_SYSTEM_SDL=OFF \
            -DSCULPTFORGE_BUILD_PYTHON=ON -DPython_EXECUTABLE="$PYTHON313" -DSCULPTFORGE_PYTHON_INSTALL_DIR=lib/sculptforge/python
          cmake --build build --parallel 4
          # UI tests need a display; they run under Xvfb in the Linux jobs above and in CI.
          ctest --test-dir build --output-on-failure -LE ui
          cd build
          cpack -G TGZ -D CPACK_PACKAGE_FILE_NAME=SculptForge-${TAG#v}-linux-${{ matrix.arch }}-${{ matrix.suffix }}
          if [ "${{ matrix.generators }}" = "RPM;TGZ" ]; then cpack -G RPM; fi
      - uses: actions/upload-artifact@v7
        with:
          name: vfx-${{ matrix.suffix }}-${{ matrix.arch }}
          path: |
            build/*.rpm
            build/*.tar.gz

  macos:
    name: macOS (universal .dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCULPTFORGE_USE_SYSTEM_SDL=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --parallel 4
          # UI tests need a display; they run under Xvfb in the Linux jobs above and in CI.
          ctest --test-dir build --output-on-failure -LE ui
      - name: Package (signed ad-hoc inside CPack, see cmake/MacSign.cmake)
        run: cd build && cpack -G DragNDrop
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: build/*.dmg

  windows:
    name: Windows x64 (installer, .zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - name: Build and test
        run: |
          cmake -S . -B build -DSCULPTFORGE_USE_SYSTEM_SDL=OFF
          cmake --build build --config Release --parallel 4
          # UI tests need a display; they run under Xvfb in the Linux jobs above and in CI.
          ctest --test-dir build -C Release --output-on-failure -LE ui
      - name: Package
        run: cd build && cpack -C Release -G "NSIS;ZIP"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build/*.exe
            build/*.zip

  publish:
    name: Publish GitHub Release
    needs: [linux, vfx, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Version-less copies (fixed links such as releases/latest/download/SculptForge-macos.dmg)
        run: |
          cd dist
          V=${TAG#v}
          cp "SculptForge-$V-windows-x86_64.exe" SculptForge-windows-x86_64-setup.exe
          cp "SculptForge-$V-windows-x86_64.zip" SculptForge-windows-x86_64-portable.zip
          cp "SculptForge-$V-darwin-universal.dmg" SculptForge-macos.dmg
          cp "SculptForge-$V-x86_64.AppImage" SculptForge-linux-x86_64.AppImage
          cp "SculptForge-$V-aarch64.AppImage" SculptForge-linux-arm64.AppImage
          cp "sculptforge_${V}_amd64.deb" sculptforge_amd64.deb
          cp "sculptforge_${V}_arm64.deb" sculptforge_arm64.deb
          cp "sculptforge-$V-1.x86_64.rpm" sculptforge.x86_64.rpm
          cp "sculptforge-$V-1.aarch64.rpm" sculptforge.aarch64.rpm
      - name: Blender add-on (extension and legacy zips, plus a version-less copy for the website's link)
        run: |
          python3 addons/blender/build_addon.py --check --version "${TAG#v}" --out dist
          cp "dist/sculptforge_bridge-${TAG#v}.zip" dist/sculptforge_bridge.zip
      - name: ZBrush ZTool Export plug-in (ZScript source; ZBrush compiles it)
        run: cp integrations/zbrush/SculptForgeZToolExport.txt dist/
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          awk "/^## \[${TAG#v}\]/{flag=1;next} /^## \[/{flag=0} flag" CHANGELOG.md > notes.md
          cat packaging/release-notes-footer.md >> notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SculptForge ${TAG#v}" --notes-file notes.md
          gh release upload "$TAG" dist/* --clobber
