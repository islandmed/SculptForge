# Monthly sculpt challenge: .github/challenges.txt is the theme list. The schedule itself (theme on the 1st, reminder on
# the 20th, Discord event for the 27th, gallery + poll on the 28th, winner on the 1st) runs from ~/Work/.sf/challenge.py
# on the sf-challenge.timer, which reads the themes from this repository. This workflow is only a manual fallback that
# posts the current month's theme through the DISCORD_CHALLENGE_WEBHOOK secret (the runtime recognises that post and
# won't post it again); without the secret it skips. No checkout of untrusted code, no other secrets.
name: Monthly challenge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/challenges.txt
          sparse-checkout-cone-mode: false
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHALLENGE_WEBHOOK }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os, sys, urllib.request
          hook = os.environ.get("WEBHOOK", "")
          if not hook:
              print("DISCORD_CHALLENGE_WEBHOOK is not set; nothing to post."); sys.exit(0)
          today = datetime.date.today()
          themes = [l.strip() for l in open(".github/challenges.txt", encoding="utf-8")
                    if l.strip() and not l.lstrip().startswith("#")]
          start = (2026, 11)  # November 2026 uses the first theme
          idx = ((today.year - start[0]) * 12 + today.month - start[1]) % len(themes)
          name, _, prompt = themes[idx].partition("|")
          name, prompt = name.strip(), prompt.strip()
          month = today.strftime("%B")
          text = (f"# 🏆 {month} challenge: **{name}**\n{prompt}\n\n"
                  "Post your entry in this channel as an image (WIPs welcome in #wip-and-feedback). Submissions close on "
                  f"the 27th of {month} at 23:59 (server time), then everyone votes in a poll here until the end of the "
                  "month. Your latest image counts as your entry. The winner gets **Featured Artist** and a spot on "
                  "sculptforge.app. Any app is fine, but we'd love to see what you make in SculptForge!")
          body = json.dumps({"content": text, "username": "SculptForge Challenges",
                             "allowed_mentions": {"parse": []}}).encode()
          req = urllib.request.Request(hook, data=body, headers={"Content-Type": "application/json",
                                                                 "User-Agent": "SculptForge-challenge"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("announce", name, r.status)
          EOF
